name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RISCV_TARGET: riscv64gc-unknown-none-elf

jobs:
  # ── Fast: format check (stable Rust, no cross-compilation) ─────────
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting (all crates)
        run: |
          cargo fmt -- --check
          cargo fmt --manifest-path scripts/keygen/Cargo.toml -- --check
          cargo fmt --manifest-path scripts/verify/Cargo.toml -- --check

  # ── Lint: clippy + audit + no placeholders ─────────────────────────
  lint:
    name: Lint & Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ env.RISCV_TARGET }}
          components: clippy, rust-src
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: lint-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: lint-${{ runner.os }}-
      - name: Clippy (firmware) — strict
        run: |
          cargo clippy --target ${{ env.RISCV_TARGET }} --release -- \
            -D warnings \
            -D clippy::all \
            -D clippy::unwrap_used \
            -D clippy::expect_used \
            -D clippy::todo
      - name: Clippy (keygen) — strict
        run: |
          cargo clippy --manifest-path scripts/keygen/Cargo.toml --release -- \
            -D warnings \
            -D clippy::all \
            -D clippy::unwrap_used \
            -D clippy::expect_used \
            -D clippy::todo
      - name: Clippy (verifier) — strict
        run: |
          cargo clippy --manifest-path scripts/verify/Cargo.toml --release -- \
            -D warnings \
            -D clippy::all \
            -D clippy::unwrap_used \
            -D clippy::expect_used \
            -D clippy::todo
      - name: No TODO/FIXME/HACK/XXX in source
        run: |
          echo "Checking for placeholder comments..."
          if grep -rn "TODO\|FIXME\|HACK\|XXX\|PLACEHOLDER" src/ scripts/ --include="*.rs" --include="*.toml"; then
            echo "ERROR: Found placeholder comments in source"
            exit 1
          fi
          echo "✓ No placeholder comments"
      - name: Cargo audit (security vulnerabilities)
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - name: Check deny(warnings) in firmware
        run: |
          grep -q '#!\[deny(warnings)\]' src/main.rs || {
            echo "ERROR: src/main.rs missing #![deny(warnings)]"
            exit 1
          }
          echo "✓ #![deny(warnings)] present"

  # ── Build: firmware + size check (parallel with lint) ──────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ env.RISCV_TARGET }}
          components: rust-src
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: build-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: build-${{ runner.os }}-
      - name: Build firmware (release)
        run: cargo build --target ${{ env.RISCV_TARGET }} --release
      - name: Check binary size
        run: |
          TEXT_SIZE=$(readelf -SW target/${{ env.RISCV_TARGET }}/release/fortis | grep "\.text" | awk '{print strtonum("0x"$7)}')
          RODATA_SIZE=$(readelf -SW target/${{ env.RISCV_TARGET }}/release/fortis | grep "\.rodata" | awk '{print strtonum("0x"$7)}')
          CODE_SIZE=$((TEXT_SIZE + RODATA_SIZE))
          echo "Code: .text=${TEXT_SIZE} .rodata=${RODATA_SIZE} total=${CODE_SIZE} bytes"
          if [ "$CODE_SIZE" -gt 65536 ]; then
            echo "ERROR: Code too large ($CODE_SIZE bytes > 64 KiB)"
            exit 1
          fi
          echo "✓ Binary size OK (${CODE_SIZE} bytes < 64 KiB)"
      - name: Check no_std in firmware
        run: |
          grep -q '#!\[no_std\]' src/main.rs || {
            echo "ERROR: src/main.rs missing #![no_std]"
            exit 1
          }
          echo "✓ #![no_std] present"
      - name: Check panic = abort in release profile
        run: |
          grep -q 'panic = "abort"' Cargo.toml || {
            echo "ERROR: Cargo.toml missing panic = abort in release profile"
            exit 1
          }
          echo "✓ panic = abort"
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: target/${{ env.RISCV_TARGET }}/release/fortis
          retention-days: 1

  # ── Verify: QEMU verification (depends on build) ──────────────────
  verify:
    name: Verify (QEMU)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-misc
      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware/
      - name: Prepare firmware binary
        run: |
          mkdir -p target/${{ env.RISCV_TARGET }}/release
          cp firmware/fortis target/${{ env.RISCV_TARGET }}/release/fortis
          chmod +x target/${{ env.RISCV_TARGET }}/release/fortis
      - name: Cache cargo (verifier deps)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            scripts/verify/target
          key: verify-${{ runner.os }}-${{ hashFiles('scripts/verify/Cargo.lock') }}
          restore-keys: verify-${{ runner.os }}-
      - name: Host-side verification
        timeout-minutes: 2
        run: |
          cargo build --manifest-path scripts/verify/Cargo.toml --release
          cargo run --manifest-path scripts/verify/Cargo.toml --release \
            -- target/${{ env.RISCV_TARGET }}/release/fortis
