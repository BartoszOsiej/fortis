[package]
name = "riscv-trust"
version = "0.2.0"
edition = "2021"
description = "Bare-metal RISC-V chain-of-trust demo: MMIO UART, measured boot, post-quantum signature verification on QEMU virt"
license = "MIT"
repository = "https://github.com/BartoszOsiej/riscv-trust"

[dependencies]
# Real SHA-256 — no_std, no heap
sha2 = { version = "0.11", default-features = false }
digest = { version = "0.11", default-features = false }

# ML-KEM-768 — no_std, no heap, hazmat for deterministic ops
ml-kem = { version = "0.3", default-features = false, features = ["hazmat"] }

[profile.dev]
panic = "abort"

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
strip = "symbols"
panic = "abort"
